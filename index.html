<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IT Inventory Dashboard</title>
    <script type="text/javascript" src="https://www.gstatic.com/charts/loader.js"></script>
    <style>
        * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background: #f0f2f5; margin: 0; padding: 20px; }
        .dashboard-container { max-width: 1400px; margin: 0 auto; background: white; border-radius: 20px; box-shadow: 0 8px 20px rgba(0,0,0,0.1); padding: 20px; }
        h1 { margin-top: 0; color: #1e3a8a; font-size: 1.8rem; border-left: 6px solid #3b82f6; padding-left: 15px; }
        .filter-group { margin-bottom: 20px; }
        .filter-group label { font-weight: 600; margin-right: 15px; color: #334155; }
        .filter-btn { background: #f1f5f9; border: none; padding: 8px 16px; border-radius: 40px; font-weight: 500; cursor: pointer; margin: 0 4px 8px 0; transition: all 0.2s ease; }
        .filter-btn.active { background: #3b82f6; color: white; }
        .kpi-row { display: flex; gap: 20px; margin-bottom: 30px; flex-wrap: wrap; }
        .kpi-card { background: linear-gradient(135deg, #1e293b, #0f172a); color: white; flex: 1; min-width: 180px; border-radius: 20px; padding: 20px; }
        .kpi-card.total-cost { background: linear-gradient(135deg, #065f46, #047857); }
        .kpi-card.total-items { background: linear-gradient(135deg, #1e40af, #2563eb); }
        .kpi-label { font-size: 0.8rem; text-transform: uppercase; opacity: 0.8; }
        .kpi-value { font-size: 2rem; font-weight: 800; margin-top: 8px; }
        .chart-section { background: #f8fafc; border-radius: 20px; padding: 15px; margin-bottom: 30px; }
        .table-section { overflow-x: auto; border-radius: 16px; border: 1px solid #e2e8f0; background: white; }
        table { width: 100%; border-collapse: collapse; font-size: 0.75rem; }
        th { background: #f1f5f9; padding: 12px 8px; text-align: left; font-weight: 700; position: sticky; top: 0; }
        td { padding: 10px 8px; border-bottom: 1px solid #e2e8f0; }
        tr:hover { background: #fef9c3; }
        .filter-input { width: 100%; padding: 6px 8px; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 0.7rem; margin-top: 5px; box-sizing: border-box; }
        .filter-input:focus { outline: none; border-color: #3b82f6; box-shadow: 0 0 0 2px rgba(59,130,246,0.2); }
        .badge { padding: 4px 8px; border-radius: 20px; font-size: 0.7rem; font-weight: 600; }
        .badge.assigned { background: #dbeafe; color: #1e40af; }
        .badge.instock { background: #dcfce7; color: #166534; }
        .badge.broken { background: #fee2e2; color: #991b1b; }
        footer { margin-top: 25px; text-align: center; color: #64748b; font-size: 0.7rem; }
        .stats-info { font-size: 0.75rem; color: #64748b; margin-bottom: 15px; text-align: right; }
        .loading { text-align: center; padding: 40px; color: #64748b; }
        .clear-filters-btn { background: #ef4444; color: white; border: none; padding: 6px 12px; border-radius: 8px; cursor: pointer; font-size: 0.7rem; margin-left: 10px; }
        .clear-filters-btn:hover { background: #dc2626; }
    </style>
</head>
<body>
<div class="dashboard-container">
    <h1>📊 IT Inventory Dashboard</h1>
    <div class="stats-info" id="stats-info">Connecting to Google Sheets...</div>

    <div class="filter-group">
        <label>🔘 Status Filter:</label>
        <div id="status-filters">
            <button class="filter-btn active" data-status="All">All</button>
        </div>
    </div>

    <div class="kpi-row">
        <div class="kpi-card total-cost"><div class="kpi-label">💰 Total Purchase Cost</div><div class="kpi-value" id="total-cost-val">$0</div></div>
        <div class="kpi-card total-items"><div class="kpi-label">📦 Total Assets</div><div class="kpi-value" id="total-items-val">0</div></div>
    </div>

    <div class="chart-section"><div id="chart-category" style="width: 100%; height: 380px;"></div></div>

    <div class="table-section">
        <table id="inventory-table">
            <thead id="table-header">
                <!-- Dynamic header with search inputs will be inserted here -->
            </thead>
            <tbody id="table-body"><tr><td colspan="7" class="loading">⏳ Loading data from Google Sheets...</td></tr></tbody>
        </table>
    </div>
    <footer>Source: Google Sheets (live data) | Type in any column to filter the table</footer>
</div>

<script>
    google.charts.load('current', { packages: ['corechart'] });
    
    const CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vQOC100h043T7jDlGk5HopKQWiD7rYW3uz8Fszn5rq-LiRYUV2gA0unvIsdh8ixU4OZaB1SmAT9_BOh/pub?gid=0&single=true&output=csv";
    
    let inventoryData = [];
    let currentStatus = "All";
    let columnFilters = {
        assetTag: '',
        model: '',
        category: '',
        status: '',
        company: '',
        purchaseDate: '',
        purchaseCost: ''
    };
    
    async function loadData() {
        document.getElementById('table-body').innerHTML = '<tr><td colspan="7" class="loading">⏳ Loading data from Google Sheets...</td></tr>';
        document.getElementById('stats-info').innerHTML = 'Connecting to Google Sheets... 🔄';
        
        try {
            const response = await fetch(CSV_URL);
            if (!response.ok) throw new Error(`HTTP error: ${response.status}`);
            const csvText = await response.text();
            parseCSV(csvText);
            document.getElementById('stats-info').innerHTML = `✅ Loaded ${inventoryData.length} assets | Last update: ${new Date().toLocaleString()}`;
        } catch (error) {
            console.error("Error:", error);
            document.getElementById('table-body').innerHTML = `<tr><td colspan="7" class="loading">❌ Error loading data: ${error.message}<br><br>Make sure your Google Sheet is published as CSV and the link is correct.</td></tr>`;
            document.getElementById('stats-info').innerHTML = `❌ Error - ${new Date().toLocaleString()}`;
        }
    }
    
    function parseCSV(csvText) {
        const rows = [];
        const lines = csvText.split(/\r?\n/);
        if (lines.length < 2) return;
        
        const headers = parseCSVLine(lines[0]);
        
        let colIdx = {
            assetTag: -1, model: -1, category: -1, status: -1, 
            company: -1, purchaseDate: -1, purchaseCost: -1
        };
        
        headers.forEach((h, i) => {
            const clean = h.replace(/^"|"$/g, '').trim();
            if (clean === 'Asset Tag') colIdx.assetTag = i;
            if (clean === 'Model') colIdx.model = i;
            if (clean === 'Category') colIdx.category = i;
            if (clean === 'Status') colIdx.status = i;
            if (clean === 'Company') colIdx.company = i;
            if (clean === 'Purchase Date') colIdx.purchaseDate = i;
            if (clean === 'Purchase Cost') colIdx.purchaseCost = i;
        });
        
        for (let i = 1; i < lines.length; i++) {
            if (lines[i].trim() === '') continue;
            const fields = parseCSVLine(lines[i]);
            if (fields.length < 2) continue;
            
            let rawStatus = (colIdx.status >= 0 && fields[colIdx.status]) ? fields[colIdx.status].replace(/^"|"$/g, '').trim() : '';
            
            let status = rawStatus;
            if (rawStatus === 'Ready to Deploy Deployed') status = 'Assigned';
            if (rawStatus === 'Ready to Deploy') status = 'In Stock';
            if (rawStatus === 'Pending') status = 'Broken/Damaged';
            
            let rawCost = (colIdx.purchaseCost >= 0 && fields[colIdx.purchaseCost]) ? fields[colIdx.purchaseCost].replace(/^"|"$/g, '').trim() : '0';
            rawCost = rawCost.replace(/,/g, '');
            let purchaseCost = parseFloat(rawCost) || 0;
            
            let rawDate = (colIdx.purchaseDate >= 0 && fields[colIdx.purchaseDate]) ? fields[colIdx.purchaseDate].replace(/^"|"$/g, '').trim() : '';
            if (rawDate.includes(' ')) rawDate = rawDate.split(' ')[0];
            if (rawDate === '') rawDate = '—';
            
            let company = (colIdx.company >= 0 && fields[colIdx.company]) ? fields[colIdx.company].replace(/^"|"$/g, '').trim() : '';
            if (company === '') company = '—';
            
            let category = (colIdx.category >= 0 && fields[colIdx.category]) ? fields[colIdx.category].replace(/^"|"$/g, '').trim() : 'Uncategorized';
            
            if (colIdx.assetTag >= 0 && fields[colIdx.assetTag]) {
                rows.push({
                    assetTag: fields[colIdx.assetTag].replace(/^"|"$/g, ''),
                    model: (colIdx.model >= 0 && fields[colIdx.model]) ? fields[colIdx.model].replace(/^"|"$/g, '').substring(0, 45) : '—',
                    category: category,
                    status: status,
                    company: company,
                    purchaseDate: rawDate,
                    purchaseCost: purchaseCost
                });
            }
        }
        
        inventoryData = rows;
        renderStatusFilters();
        renderTableHeader();
        refreshDisplay();
    }
    
    function parseCSVLine(line) {
        const result = [];
        let current = '';
        let inQuotes = false;
        for (let i = 0; i < line.length; i++) {
            const char = line[i];
            if (char === '"') {
                inQuotes = !inQuotes;
            } else if (char === ',' && !inQuotes) {
                result.push(current);
                current = '';
            } else {
                current += char;
            }
        }
        result.push(current);
        return result;
    }
    
    function renderStatusFilters() {
        const statuses = [...new Set(inventoryData.map(i => i.status))].sort();
        const statusDiv = document.getElementById('status-filters');
        statusDiv.innerHTML = '';
        
        const allStatusBtn = document.createElement('button');
        allStatusBtn.textContent = 'All';
        allStatusBtn.className = `filter-btn ${currentStatus === 'All' ? 'active' : ''}`;
        allStatusBtn.dataset.status = 'All';
        allStatusBtn.onclick = () => { currentStatus = 'All'; refreshDisplay(); };
        statusDiv.appendChild(allStatusBtn);
        
        statuses.forEach(s => {
            const btn = document.createElement('button');
            btn.textContent = s;
            btn.className = `filter-btn ${currentStatus === s ? 'active' : ''}`;
            btn.dataset.status = s;
            btn.onclick = () => { currentStatus = s; refreshDisplay(); };
            statusDiv.appendChild(btn);
        });
    }
    
    function renderTableHeader() {
        const columns = [
            { key: 'assetTag', label: 'Asset Tag' },
            { key: 'model', label: 'Model' },
            { key: 'category', label: 'Category' },
            { key: 'status', label: 'Status' },
            { key: 'company', label: 'Company' },
            { key: 'purchaseDate', label: 'Purchase Date' },
            { key: 'purchaseCost', label: 'Purchase Cost (USD)' }
        ];
        
        const thead = document.getElementById('table-header');
        thead.innerHTML = '';
        
        const headerRow = document.createElement('tr');
        
        // Create column headers with filter inputs
        columns.forEach(col => {
            const th = document.createElement('th');
            th.style.verticalAlign = 'top';
            th.style.minWidth = '120px';
            
            const label = document.createElement('div');
            label.textContent = col.label;
            label.style.fontWeight = '700';
            label.style.marginBottom = '8px';
            
            const input = document.createElement('input');
            input.type = 'text';
            input.placeholder = `Filter ${col.label}...`;
            input.className = 'filter-input';
            input.value = columnFilters[col.key] || '';
            input.addEventListener('input', (e) => {
                columnFilters[col.key] = e.target.value.toLowerCase();
                refreshDisplay();
            });
            
            th.appendChild(label);
            th.appendChild(input);
            headerRow.appendChild(th);
        });
        
        // Add clear filters button column
        const thAction = document.createElement('th');
        thAction.style.verticalAlign = 'top';
        thAction.style.textAlign = 'center';
        const clearBtn = document.createElement('button');
        clearBtn.textContent = 'Clear All Filters';
        clearBtn.className = 'clear-filters-btn';
        clearBtn.onclick = () => {
            for (let key in columnFilters) {
                columnFilters[key] = '';
            }
            // Clear all input values in the header
            document.querySelectorAll('.filter-input').forEach(input => {
                input.value = '';
            });
            refreshDisplay();
        };
        thAction.appendChild(clearBtn);
        headerRow.appendChild(thAction);
        
        thead.appendChild(headerRow);
    }
    
    function getBadgeClass(status) {
        if (status === 'Assigned') return 'assigned';
        if (status === 'In Stock') return 'instock';
        if (status === 'Broken/Damaged') return 'broken';
        return '';
    }
    
    function refreshDisplay() {
        // Apply status filter
        let filtered = inventoryData;
        if (currentStatus !== 'All') {
            filtered = filtered.filter(item => item.status === currentStatus);
        }
        
        // Apply column text filters
        filtered = filtered.filter(item => {
            // Check each column filter
            if (columnFilters.assetTag && !item.assetTag.toLowerCase().includes(columnFilters.assetTag)) return false;
            if (columnFilters.model && !item.model.toLowerCase().includes(columnFilters.model)) return false;
            if (columnFilters.category && !item.category.toLowerCase().includes(columnFilters.category)) return false;
            if (columnFilters.status && !item.status.toLowerCase().includes(columnFilters.status)) return false;
            if (columnFilters.company && !item.company.toLowerCase().includes(columnFilters.company)) return false;
            if (columnFilters.purchaseDate && !item.purchaseDate.toLowerCase().includes(columnFilters.purchaseDate)) return false;
            if (columnFilters.purchaseCost) {
                const costStr = item.purchaseCost.toString();
                if (!costStr.includes(columnFilters.purchaseCost)) return false;
            }
            return true;
        });
        
        // Update button styles
        document.querySelectorAll('#status-filters .filter-btn').forEach(btn => {
            if ((currentStatus === 'All' && btn.dataset.status === 'All') || btn.dataset.status === currentStatus) {
                btn.classList.add('active');
            } else {
                btn.classList.remove('active');
            }
        });
        
        // Calculate KPIs
        const totalCost = filtered.reduce((sum, item) => sum + item.purchaseCost, 0);
        const totalItems = filtered.length;
        
        document.getElementById('total-cost-val').innerHTML = `$${totalCost.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 })}`;
        document.getElementById('total-items-val').innerText = totalItems;
        
        // Update table body
        const tbody = document.getElementById('table-body');
        if (filtered.length === 0) {
            tbody.innerHTML = '<tr><td colspan="8" style="text-align:center">No assets match the selected filters</td></tr>';
        } else {
            tbody.innerHTML = filtered.map(item => `
                <tr>
                    <td>${escapeHtml(item.assetTag)}</td>
                    <td>${escapeHtml(item.model)}</td>
                    <td>${escapeHtml(item.category)}</td>
                    <td><span class="badge ${getBadgeClass(item.status)}">${escapeHtml(item.status)}</span></td>
                    <td>${escapeHtml(item.company)}</td>
                    <td>${escapeHtml(item.purchaseDate)}</td>
                    <td>$${item.purchaseCost.toFixed(2)}</td>
                </tr>
            `).join('');
        }
        
        // Update chart: Group by category
        const categoryMap = new Map();
        filtered.forEach(item => {
            const cat = item.category;
            const cost = item.purchaseCost;
            categoryMap.set(cat, (categoryMap.get(cat) || 0) + cost);
        });
        
        const chartData = [['Category', 'Accumulated Cost (USD)', { role: 'annotation', type: 'string' }]];
        for (let [cat, cost] of categoryMap.entries()) {
            chartData.push([cat, cost, `$${cost.toFixed(2)}`]);
        }
        
        const dataTable = google.visualization.arrayToDataTable(chartData);
        const options = {
            title: `💰 Cost by Category (Total: $${totalCost.toFixed(2)}) | Status: ${currentStatus}`,
            backgroundColor: '#f8fafc',
            colors: ['#3b82f6'],
            legend: { position: 'top' },
            bar: { groupWidth: '65%' },
            chartArea: { width: '65%', height: '70%' },
            annotations: { alwaysOutside: true, textStyle: { fontSize: 10, color: '#1e293b', bold: true } },
            vAxis: { title: 'Cost (USD)', format: 'currency', minValue: 0 },
            hAxis: { title: 'Category', slantedText: true, slantedTextAngle: 30 }
        };
        
        const chart = new google.visualization.BarChart(document.getElementById('chart-category'));
        chart.draw(dataTable, options);
    }
    
    function escapeHtml(str) {
        if (!str) return '';
        return str.replace(/[&<>]/g, function(m) {
            if (m === '&') return '&amp;';
            if (m === '<') return '&lt;';
            if (m === '>') return '&gt;';
            return m;
        });
    }
    
    loadData();
</script>
</body>
</html>
